<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>XCUSTOM — Ropa personalizada FiveM</title>

  <style>
    :root{
      --bg:#060806;
      --panel:#0b130f;
      --card:#0f1812;
      --text:#e9f5ee;
      --muted:#9bb1a2;
      --green:#19ff6a;
      --green2:#00c853;
      --border:rgba(25,255,106,.22);
      --shadow:0 14px 50px rgba(0,0,0,.45);
      --radius:20px;
      --max:1180px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 20% 0%, rgba(25,255,106,.12), transparent 60%),
        radial-gradient(700px 420px at 85% 10%, rgba(0,200,83,.09), transparent 60%),
        linear-gradient(180deg, #040604, var(--bg));
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:0 20px}

    /* NAV */
    .nav{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background: rgba(4,6,4,.72);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .nav-inner{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0;
      gap:12px;
    }
    .brand{display:flex; align-items:center; gap:12px}
    .logo{
      width:40px; height:40px; border-radius:12px;
      background: url("xcustom-logo.png") center/cover no-repeat;
      border:1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      flex:0 0 auto;
    }
    .brand h1{margin:0; font-size:16px; letter-spacing:.4px}
    .brand small{display:block; margin-top:2px; font-size:12px; color:var(--muted)}
    .menu{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      justify-content:center;
    }
    .menu a{
      font-size:13px;
      padding:10px 12px;
      border-radius:12px;
      color:rgba(233,245,238,.88);
      transition:.18s ease;
    }
    .menu a:hover{background: rgba(255,255,255,.05)}

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background: linear-gradient(135deg, rgba(25,255,106,.18), rgba(0,200,83,.10));
      box-shadow: var(--shadow);
      font-weight:800;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }
    .btn:hover{transform: translateY(-1px); filter:brightness(1.05)}
    .btn.secondary{
      background: rgba(255,255,255,.03);
      box-shadow:none;
      border-color: rgba(255,255,255,.10);
      font-weight:700;
    }

    /* HERO */
    .hero{padding:64px 0 26px}
    .hero-box{
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.02);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:28px;
      position:relative;
      overflow:hidden;
    }
