<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XCUSTOM — Ropa personalizada FiveM</title>

  <style>
    :root{
      --bg:#060806;
      --green:#19ff6a;
      --text:#e9f5ee;
      --muted:#9bb1a2;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui, Arial;
      background:#040604;
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1180px;margin:auto;padding:20px}

    /* NAV */
    .nav{
      position:sticky;top:0;
      background:#050805;
      border-bottom:1px solid #1aff6a33;
    }
    .nav-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo{
      width:42px;height:42px;
      background:url("xcustom-logo.png") center/cover no-repeat;
      border-radius:12px;
      border:1px solid #1aff6a55;
    }
    .btn{
      padding:10px 14px;
      border-radius:14px;
      background:#0b1b12;
      border:1px solid #1aff6a55;
      font-weight:800;
    }

    /* HERO */
    .hero{
      padding:70px 0;
      text-align:center;
    }
    .hero h1{
      font-size:42px;
    }
    .hero span{color:var(--green)}

    /* SHOWCASE */
    .show-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }
    .tile{
      background:#0b130f;
      border:1px solid #1aff6a33;
      border-radius:var(--radius);
      padding:14px;
      text-align:center;
    }
    .tile h3{
      color:var(--green);
      margin:6px 0 10px;
    }
    .tile img{
      width:100%;
      height:260px;
      object-fit:contain;
      background:#000;
      border-radius:12px;
      pointer-events:none;
    }

    /* CONTACT */
    input,textarea{
      width:100%;
      padding:12px;
      background:#0b130f;
      border:1px solid #1aff6a33;
      border-radius:12px;
      color:white;
      margin-bottom:10px;
    }
    textarea{min-height:120px}

    footer{
      margin-top:40px;
      padding:20px;
      border-top:1px solid #1aff6a33;
      text-align:center;
      color:var(--muted);
    }

    .discord-float{
      position:fixed;
      bottom:20px;
      right:20px;
      background:var(--green);
      color:#041007;
      padding:14px 18px;
      border-radius:999px;
      font-weight:900;
    }

    @media(max-width:900px){
      .show-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <div class="logo"></div>
      <strong>XCUSTOM</strong>
    </div>
    <a class="btn" href="https://discord.gg/MA4TQEJ7" target="_blank">🎮 Discord</a>
  </div>
</div>

<!-- HERO -->
<div class="hero wrap">
  <h1>Ropa personalizada para <span>FiveM</span></h1>
  <p>Camisas · Pantalones · Chalecos</p>
</div>

<!-- SHOWCASE -->
<div class="wrap">
  <div class="show-grid">

    <div class="tile">
      <h3>Camisas</h3>
      <img src="https://raw.githubusercontent.com/kamilaparicio91-maker/XCUSTOM/refs/heads/main/XCUSTOM_showcase.png">
    </div>

    <div class="tile">
      <h3>Pantalones</h3>
      <img src="https://raw.githubusercontent.com/kamilaparicio91-maker/XCUSTOM/refs/heads/main/XCUSTOM_showcase.png">
    </div>

    <div class="tile">
      <h3>Chalecos</h3>
      <img src="https://raw.githubusercontent.com/kamilaparicio91-maker/XCUSTOM/refs/heads/main/ChatGPT%20Image%2027%20dic%202025%2C%2002_22_55%20a.m..png">
    </div>

  </div>
</div>

<!-- CONTACTO -->
<div class="wrap">
  <h2>Contacto</h2>
  <input placeholder="Tu nombre">
  <input placeholder="¿Qué necesitas?">
  <textarea placeholder="Detalles"></textarea>
  <a class="btn" href="https://discord.gg/MA4TQEJ7" target="_blank">Crear ticket en Discord</a>
</div>

<footer>
  © XCUSTOM — FiveM RP
</footer>

<a class="discord-float" href="https://discord.gg/MA4TQEJ7" target="_blank">🎮 Discord</a>

</body>
</html>
